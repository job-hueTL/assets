<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe8e3dc);
scene.fog = new THREE.Fog(0xe8e3dc, 140, 220);

// ── Orthographic isometric camera ────────────────────────────────────────────
const FS = 58;
const AR = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(-FS*AR, FS*AR, FS, -FS, 0.1, 600);
const TARGET = new THREE.Vector3(14, 1.5, 23);
camera.position.set(TARGET.x + 85, 85, TARGET.z + 85);
camera.lookAt(TARGET);

// ── Controls ──────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.screenSpacePanning = false;

// ── Lighting ──────────────────────────────────────────────────────────────────
// Warm morning sun from NW
const sun = new THREE.DirectionalLight(0xfff3d8, 2.8);
sun.position.set(-35, 60, -25);
sun.castShadow = true;
const sc = sun.shadow.camera;
sc.left = -55; sc.right = 55; sc.top = 60; sc.bottom = -60;
sc.near = 1; sc.far = 220;
sun.shadow.mapSize.setScalar(3072);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// Cool fill from SE
const fill = new THREE.DirectionalLight(0xdaebff, 0.7);
fill.position.set(50, 30, 50);
scene.add(fill);

// Warm ambient
scene.add(new THREE.AmbientLight(0xfff8f0, 0.9));

// Interior ceiling lights (point lights inside rooms)
const addPL = (x, y, z, c = 0xfff4e0, i = 1.0, r = 18) => {
  const l = new THREE.PointLight(c, i, r); l.position.set(x, y, z); scene.add(l);
};
addPL(6.5, 7, 6,    0xfff4e0, 1.1); // Guest bedroom
addPL(21.5, 7, 8,   0xfff4e0, 1.2); // Master bedroom
addPL(4, 7, 16,     0xfff0d8, 0.9); // Guest bath
addPL(11, 7, 16,    0xfff4e0, 0.9); // Kitchen
addPL(7, 7, 33,     0xfff4e0, 1.4, 22); // Great room
addPL(21, 7, 19,    0xfff4e0, 0.9); // Master bath
addPL(19, 7, 26,    0xfff4e0, 0.8); // Walk-in closet
addPL(21, 7, 37,    0xfff8f0, 0.6); // Garage

// ── Materials ─────────────────────────────────────────────────────────────────

// Procedural white-oak floor texture
function makeWoodTex(w = 512, h = 512) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const base = '#d4a76a';
  ctx.fillStyle = base; ctx.fillRect(0, 0, w, h);
  // planks
  const plankW = 40;
  for (let x = 0; x < w; x += plankW) {
    ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
    // grain lines
    const grainCount = 6 + Math.floor(Math.random() * 4);
    for (let g = 0; g < grainCount; g++) {
      ctx.strokeStyle = `rgba(${Math.random()>0.5?160:120},80,30,0.07)`;
      ctx.lineWidth = 0.5 + Math.random();
      const sx = x + Math.random() * plankW;
      ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx + (Math.random()-0.5)*8, h); ctx.stroke();
    }
  }
  // plank end joints
  for (let x = 0; x < w; x += plankW) {
    for (let y = 0; y < h; y += 80 + Math.floor(Math.random()*60)) {
      ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + plankW, y); ctx.stroke();
    }
  }
  return new THREE.CanvasTexture(c);
}

function makeMarbleTex(w = 256, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#f2eeea'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 12; i++) {
    const grd = ctx.createLinearGradient(
      Math.random()*w, Math.random()*h, Math.random()*w, Math.random()*h
    );
    grd.addColorStop(0, `rgba(180,170,160,${0.03+Math.random()*0.05})`);
    grd.addColorStop(0.5, 'rgba(220,210,200,0)');
    grd.addColorStop(1, `rgba(140,130,120,${0.02+Math.random()*0.04})`);
    ctx.strokeStyle = grd; ctx.lineWidth = 0.5 + Math.random() * 1.5;
    ctx.beginPath();
    ctx.moveTo(Math.random()*w, Math.random()*h);
    ctx.bezierCurveTo(
      Math.random()*w, Math.random()*h,
      Math.random()*w, Math.random()*h,
      Math.random()*w, Math.random()*h
    );
    ctx.stroke();
  }
  return new THREE.CanvasTexture(c);
}

function makeTileTex(w = 256, h = 256) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e6e0d6'; ctx.fillRect(0, 0, w, h);
  const tileSize = 32;
  ctx.strokeStyle = 'rgba(160,148,136,0.4)'; ctx.lineWidth = 1;
  for (let x = 0; x <= w; x += tileSize) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for (let y = 0; y <= h; y += tileSize) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
  return new THREE.CanvasTexture(c);
}

const woodTex   = makeWoodTex();  woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
const marbleTex = makeMarbleTex(); marbleTex.wrapS = marbleTex.wrapT = THREE.RepeatWrapping;
const tileTex   = makeTileTex();   tileTex.wrapS = tileTex.wrapT = THREE.RepeatWrapping;
woodTex.repeat.set(4, 6); marbleTex.repeat.set(2, 2); tileTex.repeat.set(3, 3);

const M = {
  floor:    new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.75, metalness: 0.0 }),
  tile:     new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.35, metalness: 0.05 }),
  concrete: new THREE.MeshStandardMaterial({ color: 0xc4bdb2, roughness: 0.92 }),
  pavers:   new THREE.MeshStandardMaterial({ color: 0xb4ada2, roughness: 0.88 }),
  wall:     new THREE.MeshStandardMaterial({ color: 0xf5f2ed, roughness: 0.88 }),
  wallExt:  new THREE.MeshStandardMaterial({ color: 0xeae4da, roughness: 0.88 }),
  wallDark: new THREE.MeshStandardMaterial({ color: 0xddd7cc, roughness: 0.88 }),
  cabinet:  new THREE.MeshStandardMaterial({ color: 0xf0ede6, roughness: 0.28, metalness: 0.04 }),
  marble:   new THREE.MeshStandardMaterial({ map: marbleTex, roughness: 0.18, metalness: 0.08 }),
  sofa:     new THREE.MeshStandardMaterial({ color: 0x8a7f76, roughness: 0.95 }),
  sofaAccent: new THREE.MeshStandardMaterial({ color: 0x6a6058, roughness: 0.95 }),
  linen:    new THREE.MeshStandardMaterial({ color: 0xf2f0ec, roughness: 0.92 }),
  linenAcc: new THREE.MeshStandardMaterial({ color: 0xd8d2c8, roughness: 0.92 }),
  wood:     new THREE.MeshStandardMaterial({ color: 0x8b6340, roughness: 0.70 }),
  woodDark: new THREE.MeshStandardMaterial({ color: 0x6a4a28, roughness: 0.70 }),
  metal:    new THREE.MeshStandardMaterial({ color: 0x3c3028, roughness: 0.40, metalness: 0.82 }),
  chrome:   new THREE.MeshStandardMaterial({ color: 0xd8d0c8, roughness: 0.10, metalness: 0.95 }),
  rug:      new THREE.MeshStandardMaterial({ color: 0x38404e, roughness: 0.98 }),
  rugWarm:  new THREE.MeshStandardMaterial({ color: 0x5a4438, roughness: 0.98 }),
  glass:    new THREE.MeshStandardMaterial({ color: 0xb8d8e8, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.35 }),
  glassDoor: new THREE.MeshStandardMaterial({ color: 0xc8d8e0, roughness: 0.08, transparent: true, opacity: 0.5 }),
  trim:     new THREE.MeshStandardMaterial({ color: 0xd8d0c4, roughness: 0.55 }),
  appliance: new THREE.MeshStandardMaterial({ color: 0xe0dcd6, roughness: 0.18, metalness: 0.55 }),
  grass:    new THREE.MeshStandardMaterial({ color: 0x6a8c52, roughness: 0.95 }),
  carBody:  new THREE.MeshStandardMaterial({ color: 0x586070, roughness: 0.25, metalness: 0.65 }),
  door:     new THREE.MeshStandardMaterial({ color: 0x2c2820, roughness: 0.45, metalness: 0.15 }),
  garDoor:  new THREE.MeshStandardMaterial({ color: 0xddd5c8, roughness: 0.40, metalness: 0.12 }),
};

// ── Box helper ─────────────────────────────────────────────────────────────────
// x,y,z = minimum corner; w,h,d = dimensions
function box(x, y, z, w, h, d, mat, cast = true, receive = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  mesh.position.set(x + w/2, y + h/2, z + d/2);
  mesh.castShadow = cast; mesh.receiveShadow = receive;
  scene.add(mesh); return mesh;
}

// Cylinder helper (center-base at x,y,z)
function cyl(x, y, z, rt, rb, h, segs, mat) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, segs), mat);
  mesh.position.set(x, y + h/2, z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  scene.add(mesh); return mesh;
}

// Slab (floor panel, sits on y=0 going down to y=-t)
function slab(x, z, w, d, mat, t = 0.18) {
  return box(x, -t, z, w, t, d, mat, false, true);
}

// Wall segment
function wall(x, z, w, h, d, mat = M.wall) {
  return box(x, 0, z, w, h, d, mat);
}

// ── LAYOUT CONSTANTS ──────────────────────────────────────────────────────────
const WH = 9.0;   // wall height (feet/units)
const WT = 0.28;  // wall thickness
const HALL = 1.4; // hallway width between left/right halves

// Key x-coordinates
const X0 = 0;       // west exterior
const X_GBE = 13.5; // guest bedroom east
const X_HL = 13.5;  // hallway west
const X_HR = 15.1;  // hallway east / master section west
const X28 = 28.0;   // east exterior

// Key z-coordinates (north=0, south=47)
const Z0 = 0;        // north exterior
const Z_GBS = 12.0;  // guest bedroom south
const Z_MBS = 16.5;  // master bedroom south
const Z_MTS = 23.0;  // master bath south
const Z_WCS = 30.0;  // walk-in closet south
const Z_GRS = 25.0;  // great room starts
const Z47 = 47.0;    // south exterior

// ── GROUND PLANE ─────────────────────────────────────────────────────────────
const gndGeo = new THREE.PlaneGeometry(120, 120);
const gnd = new THREE.Mesh(gndGeo, M.grass);
gnd.rotation.x = -Math.PI/2; gnd.position.set(14, -0.32, 23);
gnd.receiveShadow = true; scene.add(gnd);

// ── FLOORS ────────────────────────────────────────────────────────────────────
// Guest Bedroom/Office
slab(X0, Z0, X_GBE, Z_GBS, M.floor);
// Master Bedroom
slab(X_HR, Z0, X28 - X_HR, Z_MBS, M.floor);
// Guest Bath
slab(X0, Z_GBS, 8.5, Z_GRS - Z_GBS, M.tile);
// Kitchen
slab(8.5, Z_GBS, X_GBE - 8.5, Z_GRS - Z_GBS, M.floor);
// Central hallway strip
slab(X_GBE, Z0, HALL, Z_WCS, M.tile);
// Master Bath
slab(X_HR, Z_MBS, X28 - X_HR, Z_MTS - Z_MBS, M.tile);
// Walk-In Closet
slab(X_HR, Z_MTS, 9.5, Z_WCS - Z_MTS, M.floor);
// Great Room
slab(X0, Z_GRS, 15.0, Z47 - Z_GRS, M.floor);
// Garage
slab(15.0, Z_WCS, 13.0, Z47 - Z_WCS, M.concrete);
// Patio (north exterior)
slab(X_HR, -7, X28 - X_HR, 7, M.pavers, 0.12);
// Covered Porch (south exterior)
slab(X0, Z47, 15.0, 6, M.pavers, 0.12);

// ── EXTERIOR WALLS ────────────────────────────────────────────────────────────
// North wall (two panels with patio gap on master side)
wall(X0, -WT, X_GBE + HALL, WH, WT, M.wallExt);           // guest+hall north
wall(X_HR, -WT, X28 - X_HR, WH, WT, M.wallExt);           // master north
// South wall
wall(X0, Z47, X28, WH, WT, M.wallExt);
// West wall
wall(-WT, Z0, WT, WH, Z47, M.wallExt);
// East wall
wall(X28, Z0, WT, WH, Z47, M.wallExt);

// ── INTERIOR WALLS ────────────────────────────────────────────────────────────
// Hallway west wall (east edge of guest side)
wall(X_GBE, Z0, WT, WH, Z_WCS, M.wall);
// Hallway east wall (west edge of master side)
wall(X_HR, Z0, WT, WH, Z_WCS, M.wall);

// Guest bedroom south wall
wall(X0, Z_GBS, X_GBE + WT, WH, WT, M.wall);
// Master bedroom south wall
wall(X_HR, Z_MBS, X28 - X_HR, WH, WT, M.wall);
// Guest bath east wall (separates bath from kitchen)
wall(8.5, Z_GBS, WT, WH, Z_GRS - Z_GBS, M.wall);
// Kitchen / great room south wall
wall(X0, Z_GRS, 15.0, WH, WT, M.wall);
// Master bath south wall
wall(X_HR, Z_MTS, X28 - X_HR, WH, WT, M.wall);
// Walk-in closet east wall (west edge of garage, partial)
wall(X_HR + 9.5, Z_MTS, WT, WH, Z_WCS - Z_MTS, M.wall);
// Walk-in closet south wall / garage north partial
wall(X_HR, Z_WCS, 9.5 + WT, WH, WT, M.wall);
// Garage-closet north wall (east portion, full height)
wall(X_HR + 9.5, Z_WCS, X28 - X_HR - 9.5, WH, WT, M.wallExt);

// ── WALL TOP TRIM CAPS (thin accent strip) ────────────────────────────────────
function cap(x, z, w, d, mat = M.trim) {
  return box(x, WH, z, w, 0.22, d, mat, false, false);
}
cap(-WT, -WT, X28 + 2*WT, WT + 0.22); // north
cap(-WT, Z47, X28 + 2*WT, WT + 0.22); // south
cap(-WT, -WT, WT + 0.22, Z47 + 2*WT); // west
cap(X28, -WT, WT + 0.22, Z47 + 2*WT); // east

// ── WINDOW APERTURES (glass panels) ──────────────────────────────────────────
// Guest bedroom north window
box(2, 2.2, -WT, 4.5, 3.2, WT + 0.06, M.glass);
// Master bedroom north windows
box(16, 2.2, -WT, 4, 3.2, WT + 0.06, M.glass);
box(22, 2.2, -WT, 4, 3.2, WT + 0.06, M.glass);
// Great room west windows
box(-WT, 2.0, 26, WT + 0.06, 4.5, 9, M.glass);
// Great room south slider / door
box(2, 0, Z47, 6, 7, WT + 0.06, M.glassDoor);
// Garage door
box(15.5, 0, Z47, 11.5, 7.5, WT + 0.06, M.garDoor);
// Garage door panel lines
for (let i = 1; i < 5; i++) { box(15.5, i*1.8, Z47, 11.5, 0.06, WT + 0.08, M.metal); }
// Front door (on south wall, great room side)
box(8.5, 0, Z47, 3, 7.5, WT + 0.06, M.door);

// ── GREAT ROOM ────────────────────────────────────────────────────────────────
const GRX = 0, GRZ = Z_GRS;

// Area rug
box(GRX + 0.8, 0.01, GRZ + 0.8, 12.5, 0.06, 13, M.rug);

// Main sectional sofa (L-shape facing east/hallway)
// Long section (south-facing back, seats face north-east)
box(GRX + 1.2, 0,    GRZ + 3.0, 9.5, 0.45, 3.0, M.sofa);    // seat
box(GRX + 1.2, 0.45, GRZ + 5.6, 9.5, 0.42, 0.35, M.sofa);   // back
box(GRX + 1.2, 0,    GRZ + 5.6, 9.5, 0.95, 0.35, M.sofaAccent); // back panel
// Short section (east-facing back)
box(GRX + 1.2, 0,    GRZ + 3.0, 3.0, 0.45, 3.0, M.sofa);    // returns
box(GRX + 1.0, 0,    GRZ + 3.0, 0.35, 0.95, 3.0, M.sofaAccent); // west arm
// Cushion details
for (let i = 0; i < 3; i++) {
  box(GRX + 1.4 + i*3.1, 0.45, GRZ + 3.1, 2.8, 0.38, 2.6, M.sofa);
}
// Sofa legs
[[1.4,3.1],[10.3,3.1],[1.4,5.4],[10.3,5.4]].forEach(([lx,lz]) =>
  box(GRX+lx, 0, GRZ+lz, 0.18, 0.22, 0.18, M.metal)
);

// Coffee table
box(GRX + 3.5, 0.28, GRZ + 0.8, 4.5, 0.08, 2.0, M.marble);
box(GRX + 3.7, 0,    GRZ + 0.9, 0.12, 0.28, 0.12, M.metal);
box(GRX + 7.8, 0,    GRZ + 0.9, 0.12, 0.28, 0.12, M.metal);
box(GRX + 3.7, 0,    GRZ + 2.6, 0.12, 0.28, 0.12, M.metal);
box(GRX + 7.8, 0,    GRZ + 2.6, 0.12, 0.28, 0.12, M.metal);

// Media unit (against west wall)
box(GRX + 0.3, 0,    GRZ + 7.5, 5.5, 0.55, 1.6, M.woodDark);
box(GRX + 0.3, 0.55, GRZ + 7.5, 5.5, 0.05, 1.6, M.marble);
// TV
box(GRX + 0.3, 0.6,  GRZ + 7.8, 5, 2.8, 0.09, M.metal);
// TV stand decorative objects
box(GRX + 0.5, 0.55, GRZ + 8.5, 0.8, 1.2, 0.8, new THREE.MeshStandardMaterial({color:0x8a6a4a, roughness:0.7}));

// Side table
box(GRX + 10.8, 0,  GRZ + 3.0, 1.1, 0.6, 1.1, M.wood);
// Floor lamp
box(GRX + 11.5, 0,  GRZ + 1.0, 0.12, 6.0, 0.12, M.metal);
cyl(GRX + 11.5, 5.5, GRZ + 1.0, 0.5, 0.35, 0.6, 16,
  new THREE.MeshStandardMaterial({color:0xfff8e8, roughness:0.6, transparent:true, opacity:0.75}));

// Wall art
box(GRX + 0.08, 2.8, GRZ + 11.5, 0.06, 2.8, 3.5,
  new THREE.MeshStandardMaterial({color:0xd4b89a, roughness:0.65}));
box(GRX + 0.08, 3.2, GRZ + 15.5, 0.06, 2.2, 2.2,
  new THREE.MeshStandardMaterial({color:0x7090a8, roughness:0.65}));

// Indoor plant (great room corner)
cyl(GRX + 0.9, 0, GRZ + 15.5, 0.45, 0.35, 0.65, 12,
  new THREE.MeshStandardMaterial({color:0x7a5030, roughness:0.88}));
const leafGeo = new THREE.SphereGeometry(0.9, 9, 7);
leafGeo.scale(1, 1.4, 1);
const leaf = new THREE.Mesh(leafGeo, M.grass);
leaf.position.set(GRX+0.9, 1.7, GRZ+15.5); leaf.castShadow=true; scene.add(leaf);

// ── DINING AREA (between kitchen and great room) ──────────────────────────────
const DZ = Z_GRS - 0.5;
// Dining table
box(1.0, 0,    DZ - 4.8, 6.0, 0.88, 3.2, M.wood);
box(1.2, 0.88, DZ - 4.6, 5.6, 0.07, 2.8, M.marble);
// Table legs
[[1.3, DZ-4.7],[6.5, DZ-4.7],[1.3, DZ-1.7],[6.5, DZ-1.7]].forEach(([lx,lz]) =>
  box(lx, 0, lz, 0.14, 0.88, 0.14, M.metal)
);
// Dining chairs (6)
const chairPositions = [
  [0.5, DZ-4.6, 0], [0.5, DZ-3.4, 0], [0.5, DZ-2.2, 0],
  [7.3, DZ-4.6, Math.PI], [7.3, DZ-3.4, Math.PI], [7.3, DZ-2.2, Math.PI],
];
chairPositions.forEach(([cx, cz, ry]) => {
  // Seat
  box(cx - 0.5, 0.44, cz - 0.5, 1.0, 0.08, 1.0, M.cabinet);
  // Legs
  [[cx-0.42, cz-0.42],[cx+0.42, cz-0.42],[cx-0.42, cz+0.42],[cx+0.42, cz+0.42]].forEach(([lx2,lz2]) =>
    box(lx2-0.04, 0, lz2-0.04, 0.08, 0.44, 0.08, M.metal)
  );
  // Back
  box(cx - 0.45, 0.52, cz + (ry === 0 ? 0.46 : -0.54), 0.9, 1.0, 0.08, M.cabinet);
});
// Pendant light over dining (thin rod + shade)
box(3.8, WH - 0.5, DZ - 3.6, 0.08, 2.5, 0.08, M.metal);
cyl(3.8, WH - 3.2, DZ - 3.6, 0.55, 0.45, 0.4, 16,
  new THREE.MeshStandardMaterial({color:0x2a2420, roughness:0.5, metalness:0.6}));
